name: Firefox Add-ons submission (manual, paused)

# No tag trigger. Enable AMO_PUBLISH_ENABLED only after Mozilla permits resubmission.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firefox-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require Firefox publishing to be explicitly enabled
        env:
          AMO_PUBLISH_ENABLED: ${{ vars.AMO_PUBLISH_ENABLED }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$AMO_PUBLISH_ENABLED" != true ]; then
            echo "Firefox submission is paused. Resolve Mozilla's moderation decision before enabling AMO_PUBLISH_ENABLED." >&2
            exit 1
          fi
          if [ "$REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select an existing version tag for Firefox submission." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Verify selected tag matches package and manifest versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          test "$TAG" = "v$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION"
      - run: npm ci
      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm test
      - run: npm run lint:firefox
      - name: Build and verify Firefox package
        run: |
          npm run build:firefox
          npm run verify:firefox-package
      - name: Sign and submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: npm run sign:firefox
      - name: Archive signed Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
